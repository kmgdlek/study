<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나무를 눌러 보세요</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(180deg, #bde6ff 0%, #e3f4ff 100%);
      color: #1e3a5f;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 36px 28px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(37, 99, 235, 0.18);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.9rem;
      font-weight: 800;
    }
    .sub {
      margin: 0 0 28px;
      color: #6b86a8;
      font-size: 0.95rem;
    }

    .trees {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px 10px;
    }
    .tree {
      padding: 0;
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tree .pic {
      display: block;
      aspect-ratio: 305 / 340;
      /* 원본 사진(1321x919)에서 나무 부분만 보이도록 확대 */
      background: #e3f4ff url("20261026_163336_941.jpg") no-repeat;
      background-size: 433% auto;
      background-position: 47.7% 60.4%;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .tree .num {
      display: block;
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #2563eb;
    }
    .tree:hover .pic {
      transform: translateY(-4px);
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.3);
    }
    .tree:active .pic { transform: scale(0.94); }
    .tree:focus-visible { outline: 3px solid #1e3a5f; outline-offset: 3px; border-radius: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>나무를 눌러 보세요</h1>
    <p class="sub">1번부터 10번까지</p>
    <div class="trees" id="trees"></div>
  </main>

  <script>
    const trees = document.getElementById('trees');

    for (let n = 1; n <= 10; n++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tree';
      btn.setAttribute('aria-label', `${n}번 나무`);
      btn.innerHTML = `<span class="pic"></span><span class="num">${n}번</span>`;
      btn.addEventListener('click', () => {
        alert(`${n}번입니다.`);
      });
      trees.appendChild(btn);
    }
  </script>
</body>
</html>
