<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>번호 버튼</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(180deg, #bde6ff 0%, #e3f4ff 100%);
      color: #1e3a5f;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(37, 99, 235, 0.18);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.9rem;
      font-weight: 800;
    }
    .sub {
      margin: 0 0 28px;
      color: #6b86a8;
      font-size: 0.95rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    button {
      aspect-ratio: 1;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4facfe, #2563eb);
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
    }
    button:active { transform: scale(0.94); }
    button:focus-visible { outline: 3px solid #1e3a5f; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>번호를 눌러 보세요</h1>
    <p class="sub">1번부터 10번까지</p>
    <div class="buttons" id="buttons"></div>
  </main>

  <script>
    const buttons = document.getElementById('buttons');

    for (let n = 1; n <= 10; n++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = n;
      btn.addEventListener('click', () => {
        alert(`${n}번입니다.`);
      });
      buttons.appendChild(btn);
    }
  </script>
</body>
</html>
